name: JobPilot background application worker

on:
  workflow_dispatch:
    inputs:
      application_id:
        description: Queued JobPilot application ID
        required: true
        type: string
      retry_stopped:
        description: Safely requeue this stopped auto application before running
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # GitHub keeps at most one pending run per concurrency group. A global group
  # therefore silently cancels older submissions when a user queues several
  # jobs in quick succession. Serialize duplicate dispatches for the same
  # application, while allowing every distinct approved application to run.
  group: jobpilot-application-${{ inputs.application_id }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOBPILOT_BASE_URL: ${{ secrets.JOBPILOT_BASE_URL }}
      JOBPILOT_AGENT_TOKEN: ${{ secrets.JOBPILOT_AGENT_TOKEN }}
      JOBPILOT_AGENT_ID: github-actions-${{ github.run_id }}
      JOBPILOT_WORKER_TYPE: cloud
      JOBPILOT_AGENT_HEADLESS: 'true'
      JOBPILOT_AUTO_SUBMIT: 'false'
      JOBPILOT_RUN_ONCE: 'true'
      JOBPILOT_APPLICATION_ID: ${{ inputs.application_id }}
      JOBPILOT_TASK_TIMEOUT_SECONDS: '600'
      JOBPILOT_BROWSER_PROFILE: /tmp/jobpilot-browser-profile
    steps:
      - name: Checkout JobPilot
        uses: actions/checkout@v7

      - name: Validate worker configuration
        env:
          REQUESTED_APPLICATION_ID: ${{ inputs.application_id }}
        run: |
          [[ "$REQUESTED_APPLICATION_ID" =~ ^[0-9]+$ ]] || { echo "Invalid application ID" >&2; exit 1; }
          [[ -n "$JOBPILOT_BASE_URL" ]] || { echo "JOBPILOT_BASE_URL secret is missing" >&2; exit 1; }
          [[ "$JOBPILOT_AGENT_TOKEN" == jp_agent_* ]] || { echo "JOBPILOT_AGENT_TOKEN secret is missing or invalid" >&2; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install worker dependencies
        run: python -m pip install -r requirements.txt

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Requeue the selected stopped application
        if: ${{ inputs.retry_stopped }}
        env:
          REQUESTED_APPLICATION_ID: ${{ inputs.application_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$JOBPILOT_AGENT_TOKEN\"}" \
            "$JOBPILOT_BASE_URL/api/agent/tasks/$REQUESTED_APPLICATION_ID/retry-stopped"

      - name: Process one queued application in the background
        run: python -m agent.run_agent
