name: JobPilot resume metadata diagnostic

on:
  workflow_dispatch:
    inputs:
      application_ids:
        description: '1–10 application IDs, separated by commas (metadata only; no retries)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jobpilot-resume-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install metadata dependencies
        run: python -m pip install sqlalchemy==2.0.50 'psycopg[binary]==3.2.9'
      - name: Read selected resume metadata
        env:
          JOBPILOT_DATABASE_URL: ${{ secrets.JOBPILOT_DATABASE_URL }}
          APPLICATION_IDS: ${{ inputs.application_ids }}
        run: python scripts/diagnose_application_resumes.py --application-ids "$APPLICATION_IDS"
