name: JobPilot scan worker

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Scan mode
        required: true
        default: queued
        type: choice
        options:
          - queued
          - scheduled
          - all
          - recover
          - diagnose
          - audit
          - reconcile
          - applications

permissions:
  contents: read
  actions: write

concurrency:
  group: jobpilot-scan-worker
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOBPILOT_DATABASE_URL: ${{ secrets.JOBPILOT_DATABASE_URL }}
      JOBPILOT_AUTH_MODE: supabase
      JOBPILOT_SCHEDULER_ENABLED: 'false'
      JOBPILOT_SCAN_CONCURRENCY: '2'
      JOBPILOT_SOURCE_SCAN_TIMEOUT_SECONDS: '45'
      JOBPILOT_TIMEZONE: Asia/Jerusalem
      # The hourly scan also repairs automatic applications that were queued but
      # never claimed by a GitHub worker. The repository-scoped token is enough
      # to dispatch the per-application workflow; no extra PAT secret is needed.
      JOBPILOT_GITHUB_ACTIONS_TOKEN: ${{ github.token }}
      JOBPILOT_GITHUB_REPOSITORY: ${{ github.repository }}
      JOBPILOT_GITHUB_REF: main
      JOBPILOT_GITHUB_APPLICATION_WORKFLOW: jobpilot-application.yml
    steps:
      - name: Checkout JobPilot
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install lightweight preflight dependencies
        run: >-
          python -m pip install
          fastapi==0.141.1
          sqlalchemy==2.0.50
          pydantic-settings==2.15.0
          psycopg[binary]==3.2.9
          beautifulsoup4==4.14.3
          httpx==0.28.1

      - name: Recover stuck auto-apply queue
        run: python scripts/run_cloud_scan.py --mode recover

      - name: Resolve requested scan mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            MODE="scheduled"
          else
            MODE="${REQUESTED_MODE:-queued}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved JobPilot scan mode: $MODE"

      - name: Check whether scan work is due
        id: work
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [[ -z "$JOBPILOT_DATABASE_URL" ]]; then
            echo "JOBPILOT_DATABASE_URL repository secret is missing" >&2
            exit 1
          fi
          set +e
          python scripts/run_cloud_scan.py --mode "$MODE" --check-only
          code=$?
          set -e
          if [[ "$code" -eq 0 ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$code" -eq 3 ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No JobPilot scan work is due; skipping Chromium installation."
          else
            exit "$code"
          fi

      - name: Install scanner dependencies
        if: steps.work.outputs.needed == 'true' && steps.mode.outputs.mode != 'recover'
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for collectors
        if: steps.work.outputs.needed == 'true' && steps.mode.outputs.mode != 'recover'
        run: python -m playwright install --with-deps chromium

      - name: Run scans outside Render
        if: steps.work.outputs.needed == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          echo "Running JobPilot external scan worker in mode: $MODE"
          python scripts/run_cloud_scan.py --mode "$MODE"
