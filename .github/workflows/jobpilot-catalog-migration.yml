name: JobPilot catalog migration

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only preflight, rolled-back rehearsal, or rehearse then apply
        required: true
        default: preflight
        type: choice
        options: [preflight, rehearse, apply]
      project:
        description: Exact Supabase project reference to confirm
        required: true
        type: string
      web_quiesced:
        description: Web service suspended and application workers drained
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Serializes with ordinary scans, including hourly scheduled dispatches.
concurrency:
  group: jobpilot-scan-worker
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JOBPILOT_DATABASE_URL: ${{ secrets.JOBPILOT_DATABASE_URL }}
      JOBPILOT_AUTH_MODE: supabase
      JOBPILOT_SCHEDULER_ENABLED: 'false'
      GH_TOKEN: ${{ github.token }}
      REQUESTED_ACTION: ${{ inputs.action }}
      EXPECTED_PROJECT: ${{ inputs.project }}
      WEB_QUIESCED: ${{ inputs.web_quiesced }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Check maintenance boundary
        run: |
          [[ "$EXPECTED_PROJECT" =~ ^[a-z]{20}$ ]] || exit 1
          [[ -n "$JOBPILOT_DATABASE_URL" ]] || exit 1
          if [[ "$REQUESTED_ACTION" != preflight ]]; then
            [[ "$WEB_QUIESCED" == true ]] || { echo 'Suspend web service first'; exit 1; }
            for status in queued in_progress waiting requested pending; do
              active=$(gh run list --workflow jobpilot-application.yml --status "$status" --limit 1 --json status --jq 'length')
              [[ "$active" == 0 ]] || { echo 'Application workers must finish first'; exit 1; }
            done
          fi
      - name: Install maintenance dependencies
        run: python -m pip install -r requirements.txt
      - name: Run bounded catalog maintenance
        run: |
          args=(--confirm-production --project "$EXPECTED_PROJECT" --action "$REQUESTED_ACTION")
          if [[ "$WEB_QUIESCED" == true ]]; then args+=(--confirm-web-quiesced); fi
          python scripts/migrate_cloud_catalog.py "${args[@]}"
