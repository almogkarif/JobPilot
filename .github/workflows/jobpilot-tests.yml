name: JobPilot tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test suite to run
        required: true
        default: full
        type: choice
        options:
          - full
          - user_limit
          - ranking
          - scan_resources
          - applications
          - comeet
          - catalog_inventory
      runner_mode:
        description: Runner for focused user-limit tests
        required: true
        default: github_hosted
        type: choice
        options:
          - github_hosted
          - local_ephemeral

permissions:
  contents: read

concurrency:
  group: jobpilot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_scope == 'full' || inputs.test_scope == 'applications' || inputs.test_scope == 'comeet' || inputs.test_scope == 'catalog_inventory' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout JobPilot
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Chromium
        env:
          NODE_OPTIONS: --throw-deprecation
        run: python -m playwright install --with-deps chromium

      - name: Enable local PostgreSQL integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          postgres_bin=""
          for executable in /usr/lib/postgresql/*/bin/initdb; do
            if [ -x "$executable" ]; then postgres_bin="${executable%/initdb}"; fi
          done
          test -x "$postgres_bin/initdb"
          test -x "$postgres_bin/pg_ctl"
          echo "JOBPILOT_TEST_POSTGRES_BIN=$postgres_bin" >> "$GITHUB_ENV"

      - name: Run test suite
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_scope == 'full' }}
        run: python -m pytest -q --ignore=tests/test_agent_browser_flow.py

      - name: Run application release tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope == 'applications' }}
        run: >-
          python -m pytest -q -n 4 --dist loadfile
          tests/test_agent_reporting_safety.py
          tests/test_agent_one_time_approval.py
          tests/test_agent_resume_delivery.py
          tests/test_agent_password_field.py
          tests/test_agent_live_question_wait.py
          tests/test_agent_live_question_browser.py
          tests/test_live_question_wait_api.py
          tests/test_live_question_wait_migration.py
          tests/test_live_question_wait_postgres.py
          tests/test_live_question_resume_integration.py
          tests/test_live_question_countdown_browser.py
          tests/test_guided_submission_admin_gate.py
          tests/test_guided_submission_admin_browser.py
          tests/test_guided_submission_browser.py
          tests/test_workday_account_blocker_api.py
          tests/test_workday_account_lifecycle.py
          tests/test_workday_email_sign_in.py
          tests/test_workday_posting_start_modal.py
          tests/test_intel_workday_policy.py
          tests/test_ness_submission.py
          tests/test_speedata_submission.py
          tests/test_application_submission.py
          tests/test_auto_apply_job_sort.py
          tests/test_uncertain_submission_report_recovery.py
          tests/test_application_queue_recovery.py
          tests/test_application_tracking_access.py
          tests/test_application_submit_progress.py
          tests/test_multiuser_isolation.py
          tests/test_cloud_mode.py
          tests/test_supabase_egress_optimization.py
          tests/test_applied_materials_submission.py
          tests/test_applied_materials_worker.py
          tests/test_applied_materials_postgres.py
          tests/test_applied_materials_integration.py
          tests/test_applied_materials_report_recovery.py
          tests/test_application_resume_recovery.py
          tests/test_application_resume_metadata.py
          tests/test_grade_sheet_context_repair.py
          tests/test_application_live_visibility.py
          tests/test_application_security_code_ui.py
          tests/test_application_queue_waiting_ui.py
          tests/test_application_choice_blocker_ui.py
          tests/test_auto_apply_queue_focus.py
          tests/test_auto_apply_queue_priority.py
          tests/test_auto_apply_diagnostics_v4.py
          tests/test_auto_apply_expansion_v037.py
          tests/test_one_application.py
          tests/test_yael_submission.py
          tests/test_elad_submission.py
          tests/test_elad_receipts.py
          tests/test_elad_queue.py
          tests/test_gstat_submission.py
          tests/test_gstat_queue.py

      - name: Run focused Comeet release tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope == 'comeet' }}
        run: >-
          python -m pytest -q -n 4
          tests/test_agent_browser_flow.py
          tests/test_agent_radio_question_context.py
          tests/test_comeet_submission_receipts.py
          tests/test_comeet_worker_recovery.py
          tests/test_comeet_unavailable_posting.py
          tests/test_uncertain_submission_report_recovery.py
          tests/test_agent_one_time_approval.py
          tests/test_agent_resume_delivery.py
          tests/test_agent_live_question_wait.py
          tests/test_agent_live_question_browser.py
          tests/test_live_question_resume_integration.py
          tests/test_application_choice_blocker_ui.py
          tests/test_application_submit_progress.py
          tests/test_dynamic_official_api_adapters.py
          tests/test_auto_apply_expansion_v037.py
          tests/test_supabase_egress_optimization.py::test_submit_progress_duplicate_check_reads_one_projected_event
          tests/test_supabase_egress_optimization.py::test_comeet_questionnaire_receipts_keep_diagnostics_bounded_without_private_tokens
          tests/test_supabase_egress_optimization.py::test_unavailable_comeet_posting_stops_before_another_form_or_progress_read

      - name: Run catalog inventory and automatic queue release tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope == 'catalog_inventory' }}
        run: >-
          python -m pytest -q -n 4 --dist loadfile
          tests/test_comeet_feed_inventory.py
          tests/test_comeet_inventory_reconciliation.py
          tests/test_dynamic_official_api_adapters.py
          tests/test_cyera_inventory.py
          tests/test_hourly_job_closure.py
          tests/test_collector_completeness.py
          tests/test_unified_rollout_sources.py
          tests/test_official_collector_titles.py
          tests/test_comeet_unavailable_posting.py
          tests/test_application_live_visibility.py
          tests/test_application_queue_identity_ui.py
          tests/test_application_tracking_access.py
          tests/test_auto_apply_queue_focus.py
          tests/test_auto_apply_queue_priority.py
          tests/test_application_queue_waiting_ui.py
          tests/test_job_id_search.py
          tests/test_manual_fallback_catalog_filter.py
          tests/test_partial_ranking_auto_queue.py
          tests/test_solaredge_native_application.py
          tests/test_solaredge_embedded_form.py
          tests/test_submission_approval_and_blocker_queue.py::test_comeet_session_verification_is_manual_required_and_can_open_interactive_review
          tests/test_application_submission.py
          tests/test_auto_apply_job_sort.py
          tests/test_auto_queue_resource_bounds.py
          tests/test_catalog_ranking_bounds.py
          tests/test_preference_auto_queue.py
          tests/test_ranking_default_resume_bounds.py
          tests/test_ranking_profile_bounds.py
          tests/test_ranking_targeted_refresh.py
          tests/test_catalog_egress_budget.py
          tests/test_agent_radio_question_context.py
          tests/test_comeet_submission_receipts.py
          tests/test_comeet_worker_recovery.py
          tests/test_owner_catalog_diagnostic.py
          tests/test_admin_queue_diagnostic.py
          tests/test_supabase_egress_optimization.py::test_comeet_api_inventory_reuses_one_bounded_public_feed_without_database_reads
          tests/test_supabase_egress_optimization.py::test_availability_reconciliation_returns_no_catalog_payload
          tests/test_supabase_egress_optimization.py::test_personal_tracking_is_two_bounded_metadata_queries
          tests/test_supabase_egress_optimization.py::test_live_application_visibility_reuses_compact_queries_without_descriptions
          tests/test_supabase_egress_optimization.py::test_queue_snapshot_and_health_do_not_read_job_descriptions
          tests/test_supabase_egress_optimization.py::test_personal_manual_filter_reuses_bounded_catalog_queries_without_private_payloads
          tests/test_supabase_egress_optimization.py::test_partial_ranking_queue_refusal_transfers_no_job_bodies
          tests/test_supabase_egress_optimization.py::test_admin_queue_snapshot_returns_only_bounded_metadata_without_catalog_bodies
          tests/test_supabase_egress_optimization.py::test_solaredge_embedded_flow_reuses_the_original_form_and_bounded_progress

  browser-agent:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_scope == 'full' || inputs.test_scope == 'applications' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout JobPilot
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Chromium
        env:
          NODE_OPTIONS: --throw-deprecation
        run: python -m playwright install --with-deps chromium

      - name: Run application browser tests in parallel
        run: python -m pytest -q -n 4 tests/test_agent_browser_flow.py

  user-limit:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope == 'user_limit' && (inputs.runner_mode != 'local_ephemeral' || (github.ref == 'refs/heads/main' && github.actor == 'almogkarif' && github.triggering_actor == 'almogkarif')) }}
    runs-on: ${{ inputs.runner_mode == 'local_ephemeral' && format('jobpilot-capacity-{0}', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout JobPilot
        uses: actions/checkout@v7

      - name: Set up Python
        if: ${{ inputs.runner_mode != 'local_ephemeral' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Set up temporary Python 3.13
        if: ${{ inputs.runner_mode == 'local_ephemeral' }}
        run: |
          set -euo pipefail
          test -n "${CAPACITY_CI_PYTHON:-}"
          test -x "$CAPACITY_CI_PYTHON"
          "$CAPACITY_CI_PYTHON" -c 'import sys; print(sys.version); sys.exit(0 if sys.version_info[:2] == (3, 13) else "Python 3.13 is required")'
          "$CAPACITY_CI_PYTHON" -m venv "$RUNNER_TEMP/capacity-python"
          echo "$RUNNER_TEMP/capacity-python/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run user-limit tests
        run: >-
          python -m pytest -q
          tests/test_multiuser_isolation.py::test_cloud_user_limit_is_enforced
          tests/test_supabase_egress_optimization.py::test_developer_activity_sort_reuses_one_identity_query

  ranking:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope == 'ranking' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout JobPilot
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run ranking tests
        run: >-
          python -m pytest -q
          tests/test_ranking_v2.py
          tests/test_ranking_filter_first.py
          tests/test_ranking_refresh_performance.py
          tests/test_job_requirement_sections.py
          tests/test_resume_fit.py
          tests/test_matching.py
          tests/test_dashboard_scan_suggestions.py
          tests/test_dashboard_company_diversity.py
          tests/test_supabase_egress_optimization.py::test_dashboard_scan_suggestions_project_only_three_small_rows
          tests/test_supabase_egress_optimization.py::test_dashboard_company_diversity_stays_in_one_five_row_query
          tests/test_supabase_egress_optimization.py::test_required_language_penalty_reuses_loaded_data_and_keeps_metadata_bounded
          tests/test_supabase_egress_optimization.py::test_hourly_ranking_stale_only_skips_unchanged_job
          tests/test_supabase_egress_optimization.py::test_shared_catalog_startup_never_selects_jobs
          tests/test_supabase_egress_optimization.py::test_two_stage_ranking_uses_bounded_keyset_batches
          tests/test_supabase_egress_optimization.py::test_reusing_score_components_needs_no_additional_database_reads


  scan-resources:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope == 'scan_resources' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout JobPilot
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Chromium for focused UI and submission regressions
        env:
          NODE_OPTIONS: --throw-deprecation
        run: python -m playwright install --with-deps chromium

      - name: Enable local PostgreSQL integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          postgres_bin=""
          for executable in /usr/lib/postgresql/*/bin/initdb; do
            if [ -x "$executable" ]; then postgres_bin="${executable%/initdb}"; fi
          done
          test -x "$postgres_bin/initdb"
          test -x "$postgres_bin/pg_ctl"
          echo "JOBPILOT_TEST_POSTGRES_BIN=$postgres_bin" >> "$GITHUB_ENV"

      - name: Run scan and resource-budget tests
        run: >-
          python -m pytest -q -n 4 --dist loadfile
          tests/test_twice_daily_scan_schedule.py
          tests/test_external_scan_worker.py
          tests/test_scan_worker_recovery.py
          tests/test_source_retirement_integration.py
          tests/test_unified_cloud_worker.py
          tests/test_auto_apply_diagnostics_v4.py
          tests/test_supabase_egress_optimization.py
          tests/test_catalog_ranking_bounds.py
          tests/test_catalog_egress_budget.py
          tests/test_ranking_filter_first.py
          tests/test_ranking_targeted_refresh.py
          tests/test_ranking_refresh_performance.py
          tests/test_ranking_v2_visibility.py
          tests/test_preference_auto_queue.py
          tests/test_application_queue_recovery.py
          tests/test_dashboard_company_diversity.py
          tests/test_guest_dashboard.py
          tests/test_job_id_search.py
          tests/test_ranking_v2.py
          tests/test_ranking_storage.py
          tests/test_ranking_default_resume_bounds.py
          tests/test_ranking_profile_bounds.py
          tests/test_ranking_deferred_status.py
          tests/test_ranking_refresh_failure_ui.py
          tests/test_auto_queue_resource_bounds.py
          tests/test_verified_shared_sources.py
          tests/test_source_retirements.py
          tests/test_unified_rollout_sources.py
          tests/test_source_expansion_v053.py
          tests/test_ee_source_expansion_v2.py
          tests/test_iem_source_expansion.py
          tests/test_job_text_plain_url.py
          tests/test_job_text.py
          tests/test_seniority_sql_fast_path.py
          tests/test_seniority_filter.py
          tests/test_catalog_capacity_benchmark.py
          tests/test_api.py
          tests/test_ranking_lab_api.py
          tests/test_applied_materials_submission.py
          tests/test_agent_browser_flow.py::test_greenhouse_email_verification_keeps_session_and_recognizes_nanit_confirmation
          tests/test_agent_browser_flow.py::test_greenhouse_submission_response_requires_explicit_success_evidence
