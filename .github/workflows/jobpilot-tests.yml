name: JobPilot tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobpilot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout JobPilot
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Enable local PostgreSQL integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          postgres_bin=""
          for executable in /usr/lib/postgresql/*/bin/initdb; do
            if [ -x "$executable" ]; then postgres_bin="${executable%/initdb}"; fi
          done
          test -x "$postgres_bin/initdb"
          test -x "$postgres_bin/pg_ctl"
          echo "JOBPILOT_TEST_POSTGRES_BIN=$postgres_bin" >> "$GITHUB_ENV"

      - name: Run test suite
        run: python -m pytest -q --ignore=tests/test_agent_browser_flow.py

  browser-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout JobPilot
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run application browser tests in parallel
        run: python -m pytest -q -n 4 tests/test_agent_browser_flow.py
