name: JobPilot owner catalog diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobpilot-owner-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt
      - name: Read bounded filter and queue snapshot
        env:
          JOBPILOT_DATABASE_URL: ${{ secrets.JOBPILOT_DATABASE_URL }}
          JOBPILOT_SCHEDULER_ENABLED: 'false'
          # One-time operator controls stay private even in this public repository.
          # Remove this secret after collecting the encrypted report.
          OWNER_DIAGNOSTIC_INPUTS: ${{ secrets.JOBPILOT_OWNER_DIAGNOSTIC_INPUTS }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          controls = json.loads(os.environ.pop('OWNER_DIAGNOSTIC_INPUTS'))
          recipient = Path(os.environ['RUNNER_TEMP'], 'recipient.pem')
          recipient.write_text(controls['recipient_public_key'])
          recipient.chmod(0o600)
          os.environ['EXPECTED_OWNER_EMAIL_SHA256'] = controls['expected_owner_email_sha256']
          subprocess.run([
              sys.executable, '-m', 'scripts.diagnose_owner_catalog',
              '--anchor-application-id', str(controls['anchor_application_id']),
              '--recipient-public-key-file', str(recipient),
              '--output-file', str(Path(os.environ['RUNNER_TEMP'], 'owner-diagnostic.encrypted.json')),
          ], check=True)
          PY
      - name: Upload encrypted report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: owner-diagnostic-encrypted
          path: ${{ runner.temp }}/owner-diagnostic.encrypted.json
          retention-days: 1
          if-no-files-found: error
